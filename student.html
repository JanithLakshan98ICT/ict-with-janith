<!DOCTYPE html>
<html lang="si">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Portal | ICT with Janith</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/portal.css"></head>
<body class="portal-page">
<header class="navbar scrolled"><a class="brand" href="index.html"><span class="brand-mark">&lt;/&gt;</span><span><b>ICT</b> with <strong>ජනිත්</strong></span></a><a href="index.html" class="nav-cta">← Main Website</a></header>
<main class="portal-shell">
  <div class="portal-hero"><div class="section-tag">STUDENT DIGITAL HUB</div><h1>Welcome to your<br><span>ICT Space.</span></h1><p>Results • Notes • Papers • Updates</p></div>
  <div class="login-box" id="loginBox">
    <div class="mini-icon">⌘</div><h2>Student Login</h2><p>ඔයාගේ index number එක ඇතුළත් කරන්න.</p>
    <label>INDEX NUMBER<input id="indexInput" placeholder="උදා: ICT001" autocomplete="off"></label>
    <button class="btn btn-primary" id="loginBtn">Enter Student Portal →</button>
    <small>Demo mode: ICT001 / ICT002 / ICT003</small>
  </div>
  <div class="dashboard" id="dashboard" hidden>
    <div class="dash-top"><div><span class="section-tag">STUDENT DASHBOARD</span><h2 id="studentName">Student</h2><p id="studentMeta"></p></div><button class="btn btn-ghost" id="logoutBtn">Logout</button></div>
    <div class="dash-tabs"><button data-tab="results" class="selected">Results</button><button data-tab="notes">Notes</button><button data-tab="papers">Papers</button><button data-tab="updates">Updates</button></div>
    <div id="tabContent"></div>
  </div>
</main>
<script src="js/portal.js"></script></body></html>
